[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "southpaw-tools-launcher"
version = "0.1.0"
description = "Southpaw Games internal Windows tools launcher"
requires-python = ">=3.12"
dependencies = ["PySide6==6.11.0"]

[project.scripts]
southpaw-tools = "southpaw_tools.__main__:main"
southpaw-tools-server = "southpaw_tools.server:main"

[tool.setuptools.packages.find]
include = ["southpaw_tools*"]

[tool.setuptools.package-data]
southpaw_tools = ["data/*.json", "assets/*"]
